# AutoTuner Configuration File
# This file contains all configurable parameters for the AutoTuner

# Data Settings
data:
  data_path: "./data/insurance_claims_transformed.csv"  # Path to your CSV data file (e.g., "data/dataset.csv")
  target_column: "claim_status"  # Name of the target column (e.g., "target" or "label")

# General Settings
general:
  random_state: 42
  verbose: 2
  n_jobs: -1  # Use all available cores

# ML Model Settings
ml_model:
  task_type: "classification" # classification, regression, auto
  metric: "accuracy" # accuracy, precision, recall, f1, roc_auc, average_precision, balanced_accuracy, neg_log_loss, r2, neg_mean_squared_error, neg_mean_absolute_error, neg_root_mean_squared_error, neg_mean_absolute_percentage_error
  estimator_type: "xgboost" # xgboost, lightgbm, None

# Cross-validation settings
cross_validation:
  cv_folds: 5
  n_repeats: 2
  test_size: 0.2
  stratify: true  # For classification tasks

# Optuna optimization settings
optuna:
  n_trials: 25
  max_iterations: 5
  max_no_improve: 3
  top_n_configs: 5
  sampler: "TPESampler"  # Options: TPESampler, RandomSampler, CmaEsSampler
  pruner: "MedianPruner"  # Options: MedianPruner, HyperbandPruner, null
  direction: "maximize"  # maximize or minimize

# LLM settings for search space generation
llm:
  model: "gpt-4.1-mini"
  use_dataset_analysis: true

# Default task description (can be overridden)
task:
  description: |
    The machine learning problem under investigation involves predicting a target variable
    using the provided features. The goal is to optimize model performance using automated
    hyperparameter tuning with LLM-guided search space exploration.


# Console display settings
display:
  show_progress_bar: true
  max_table_rows: 20
  decimal_precision: 4
  
# File output settings
output:
  save_results: true
  results_dir: "results"
  save_study: true
  save_best_model: true
  export_json: true  # Export tuning summary as JSON
  export_yaml: true  # Export tuning summary as YAML

# MLflow integration settings
mlflow:
  enable_mlflow: true
  experiment_name: "autotuner_optimization"
  log_agent_iterations: true  # Log each agent iteration as separate artifact
  log_trial_details: false   # Don't log individual Optuna trials (focus on agent-level)
  artifact_logging: true     # Use MLflow artifacts instead of local files
  nested_runs: true          # Use nested runs for organization